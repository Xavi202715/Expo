<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agendar Consulta</title>

    <link rel="stylesheet"
          href="css/citas.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


<!-- ================================================= -->
<!-- MODAL DE ÉXITO -->
<!-- ================================================= -->

<div id="modalExito" class="modal">

    <div class="modal-contenido">

        <div class="check">
            ✔
        </div>

        <h2>
            ¡Cita agendada!
        </h2>

        <p>
            Tu cita ha sido registrada correctamente.
        </p>

        <div class="botones">

            <button
                id="verDatos"
                type="button">

                Ver datos de la cita

            </button>

            <button
                id="cerrarModal"
                type="button">

                Regresar

            </button>

        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- CONTENEDOR -->
<!-- ================================================= -->

<div class="container">


    <!-- ================================================= -->
    <!-- PARTE IZQUIERDA -->
    <!-- ================================================= -->

    <div class="left">

        <h1>
            Agenda tu cita
        </h1>

        <p>
            Completa el siguiente formulario y agenda
            tu consulta de nutrición de manera fácil
            y rápida.
        </p>

        <div class="decoracion">
            
        </div>

    </div>



    <!-- ================================================= -->
    <!-- PARTE DERECHA -->
    <!-- ================================================= -->

    <div class="right">

        <form id="appointmentForm">


            <!-- ================================================= -->
            <!-- NOMBRE -->
            <!-- ================================================= -->

            <div class="input-group">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre completo"
                    required>

            </div>



            <!-- ================================================= -->
            <!-- CORREO -->
            <!-- ================================================= -->

            <div class="input-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@correo.com"
                    required>

            </div>



            <!-- ================================================= -->
            <!-- TELÉFONO -->
            <!-- ================================================= -->

            <div class="input-group">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="0000-0000"
                    required>

            </div>



            <!-- ================================================= -->
            <!-- MODALIDAD -->
            <!-- IMPORTANTE: VA ANTES DEL ESPECIALISTA -->
            <!-- ================================================= -->

            <div class="input-group">

                <label for="modalidad">
                    Modalidad de la cita
                </label>

                <select
                    id="modalidad"
                    required>

                    <option value="">
                        Selecciona una modalidad
                    </option>

                    <option value="Virtual">
                        💻 Virtual
                    </option>

                    <option value="Presencial">
                        📍 Presencial
                    </option>

                </select>

            </div>



            <!-- ================================================= -->
            <!-- ESPECIALISTA -->
            <!-- SOLO VIRTUAL -->
            <!-- ================================================= -->

            <div
                class="input-group campo-dinamico"
                id="grupoEspecialista">

                <label for="especialista">
                    Especialista
                </label>

                <select
                    id="especialista">

                    <option value="">
                        Selecciona un especialista
                    </option>

                    <option value="Calixta Torres">
                        Calixta Torres
                    </option>

                    <option value="Cristina Yanos">
                        Cristina Yanos
                    </option>

                    <option value="Meredith Gris">
                        Meredith Gris
                    </option>

                    <option value="Magaly Pérez">
                        Magaly Pérez
                    </option>

                    <option value="Miranda Báez">
                        Miranda Báez
                    </option>

                    <option value="Derek Pastor">
                        Derek Pastor
                    </option>

                </select>

            </div>



            <!-- ================================================= -->
            <!-- LUGAR PRESENCIAL -->
            <!-- SOLO PRESENCIAL -->
            <!-- ================================================= -->

            <div
                class="input-group campo-dinamico"
                id="grupoLugar">

                <label for="lugar">
                    Lugar de la consulta
                </label>

                <select id="lugar">

                    <option value="">
                        Selecciona un lugar
                    </option>


                    <!-- NVS -->

                    <option
                        value="NVS Nutrición y Vida Sana"
                        data-direccion="83 Av. Sur y Calle Cuscatlán #7, Edificio EPSSA nivel 1, Colonia Escalón, San Salvador, El Salvador">

                        NVS Nutrición y Vida Sana

                    </option>



                    <!-- VITALITE -->

                    <option
                        value="Clínica Nutricional Vitalite El Salvador"
                        data-direccion="Avenida de la Revolución 128, San Salvador, El Salvador">

                        Clínica Nutricional Vitalite El Salvador

                    </option>



                    <!-- NUTRIFIT -->

                    <option
                        value="Clinica Nutricional NutriFit El Salvador"
                        data-direccion="Centro Comercial Vías Españolas, local 7-B, San Salvador, El Salvador">

                        Clinica Nutricional NutriFit El Salvador

                    </option>



                    <!-- NUTRIWENDY -->

                    <option
                        value="NutriWendySV - Wendy Godoy"
                        data-direccion="Centro Comercial Loma Linda, primer nivel, local 1D, San Salvador, El Salvador">

                        NutriWendySV - Wendy Godoy

                    </option>



                    <!-- MAURA -->

                    <option
                        value="Nutricionista Maura Rodríguez"
                        data-direccion="25 Avenida Norte 114, San Salvador, El Salvador">

                        Nutricionista Maura Rodríguez

                    </option>



                    <!-- RINA PARADA -->

                    <option
                        value="Rina Elizabeth Parada Mondragón"
                        data-direccion="Medicentro La Esperanza, Módulo J, Local 220, San Salvador, El Salvador">

                        Rina Elizabeth Parada Mondragón

                    </option>



                    <!-- JOHANNA -->

                    <option
                        value="Dra. Johanna Samayoa - Nutricionista Renal"
                        data-direccion="Calle La Mascota 780, San Salvador, El Salvador">

                        Dra. Johanna Samayoa - Nutricionista Renal

                    </option>



                    <!-- NUTRICARE -->

                    <option
                        value="Nutricare Clinics"
                        data-direccion="Torre Humana, piso 15, consultorio 8, San Salvador, El Salvador">

                        Nutricare Clinics

                    </option>



                    <!-- RAQUEL -->

                    <option
                        value="Nutricionista Raquel Platero"
                        data-direccion="Avenida El Boquerón 10, San Salvador, El Salvador">

                        Nutricionista Raquel Platero

                    </option>



                    <!-- IVETTE -->

                    <option
                        value="Clínica Dra. Ivette de Rodríguez"
                        data-direccion="Calle El Mirador 5517, San Salvador, El Salvador">

                        Clínica Dra. Ivette de Rodríguez

                    </option>



                    <!-- OLGA -->

                    <option
                        value="Olga Cabrales - Nutricionista"
                        data-direccion="83 Avenida Sur 133, San Salvador, El Salvador">

                        Olga Cabrales - Nutricionista

                    </option>



                    <!-- NUTRIMADES -->

                    <option
                        value="NUTRIMADES - Clínica de Nutrición Integral"
                        data-direccion="Clínica Médica SAFE Life, Escalón, San Salvador, El Salvador">

                        NUTRIMADES - Clínica de Nutrición Integral

                    </option>



                    <!-- NUTRITION FOREVER -->

                    <option
                        value="Clinica Nutrition Forever"
                        data-direccion="Clínica #7, Boulevard Walter Thilo Deininger, Plaza Médica Ancalmo, segundo nivel, San Salvador, El Salvador">

                        Clinica Nutrition Forever

                    </option>

                </select>

            </div>



            <!-- ================================================= -->
            <!-- INFORMACIÓN DEL LUGAR -->
            <!-- ================================================= -->

            <div
                id="informacionLugar"
                class="ubicacion">

                <div class="ubicacion-titulo">

                    <span>📍</span>

                    <strong id="nombreLugar">
                        Lugar seleccionado
                    </strong>

                </div>

                <p id="direccionLugar"></p>

                <a
                    id="botonMapa"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer">

                    🗺️ Abrir ubicación en Google Maps

                </a>

            </div>



            <!-- ================================================= -->
            <!-- MAPA -->
            <!-- ================================================= -->

            <div
                id="contenedorMapa"
                class="mapa-container">

                <iframe
                    id="mapa"
                    title="Ubicación del lugar"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>



            <!-- ================================================= -->
            <!-- FECHA -->
            <!-- ================================================= -->

            <div class="input-group">

                <label for="fecha">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha"
                    required>

            </div>



            <!-- ================================================= -->
            <!-- HORA -->
            <!-- ================================================= -->

            <div class="input-group">

                <label for="hora">
                    Hora
                </label>

                <input
                    type="time"
                    id="hora"
                    required>

            </div>



            <!-- ================================================= -->
            <!-- MOTIVO -->
            <!-- ================================================= -->

            <div class="input-group">

                <label for="motivo">
                    Motivo de consulta
                </label>

                <textarea
                    id="motivo"
                    rows="4"
                    placeholder="Escribe aquí..."
                    required></textarea>

            </div>



            <!-- ================================================= -->
            <!-- BOTÓN -->
            <!-- ================================================= -->

            <button
                class="boton-confirmar"
                type="submit">

                Confirmar cita

            </button>


        </form>

    </div>

</div>



<script src="js/agendar.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriPeques - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-decorations-container">
        <div class="decor-shape left-orange-blob"></div>
        <div class="decor-shape left-green-leaves"></div>
        <div class="decor-shape right-brown-blob"></div>
        <div class="decor-shape right-green-leaves"></div>
    </div>

    <div class="app-wrapper">
        <div class="login-container">
            
            <div class="top-bar">
                <div class="top-option">
                    <div class="icon-circle"><i class="fa-regular fa-user"></i></div>
                    <span>Invitado</span>
                </div>
                <div class="top-option">
                    <div class="icon-circle"><i class="fa-solid fa-universal-access"></i></div>
                    <span>Accesibilidad</span>
                </div>
            </div>

            <div class="brand-section">
                <div class="logo-container">
                    <img src="img/logo.png" alt="Logo NutriPeques" class="brand-logo">
                </div>
                <h1 class="brand-title">Nutri<span>Peques</span></h1>
                <p class="brand-tagline">Aprende, come bien y crece fuerte</p>
            </div>

            <div class="illustration-container">
                <img src="img/niños.png" alt="Niños NutriPeques" class="main-illustration">
            </div>

            <form id="loginForm" class="login-form">
                
                <div class="input-group">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Correo electrónico" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit">
                    Iniciar sesión <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider">
                <span>o continúa con</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn google"><i class="fa-brands fa-google"></i></button>
                <button type="button" class="social-btn microsoft"><i class="fa-brands fa-windows"></i></button>
                <button type="button" class="social-btn apple"><i class="fa-brands fa-apple"></i></button>
            </div>

            <div class="accessibility-panel">
                <h3>Accesibilidad rápida</h3>
                <div class="accessibility-grid">
                    
                    <div class="access-item" id="textAccessItem" onclick="toggleZoomButtons(event)">
                        <div class="access-icon text-icon">A</div>
                        <div class="zoom-buttons" id="zoomContainer">
                            <button type="button" onclick="changeFontSize(1, event)" title="Aumentar letra">+</button>
                            <button type="button" onclick="changeFontSize(-1, event)" title="Disminuir letra">-</button>
                        </div>
                        <span>Texto grande</span>
                    </div>

                    <button type="button" class="access-item" onclick="toggleContrast()">
                        <div class="access-icon"><i class="fa-solid fa-circle-half-stroke"></i></div>
                        <span>Alto contraste</span>
                    </button>

                    <button type="button" class="access-item" onclick="speakText()">
                        <div class="access-icon"><i class="fa-solid fa-volume-high"></i></div>
                        <span>Leer en voz alta</span>
                    </button>

                    <button type="button" class="access-item" onclick="toggleLetterSpacing()">
                        <div class="access-icon letter-space">AAA</div>
                        <span>Más espacio</span>
                    </button>

                    <button type="button" class="access-item" onclick="toggleFocusVisible()">
                        <div class="access-icon"><i class="fa-solid fa-expand"></i></div>
                        <span>Enfoque visible</span>
                    </button>

                </div>
                <p class="panel-footer">Puedes cambiar estas opciones en cualquier momento.</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
